<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C++ 与工程面试题库</title>
  <meta name="description" content="标准 C++、设计模式、UE5 与 Windows 高频面试题及口述简答。">
  <link rel="stylesheet" href="styles.css?v=ae38b8ce">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">C++</span><h1>C++ 与工程面试题库</h1></div>
    <div class="toolbar">
      <label class="search"><span class="visually-hidden">搜索题库</span><input id="search-input" type="search" placeholder="搜索题目、答案或资料依据" autocomplete="off"></label>
      <select id="scope-filter" aria-label="按标准筛选"><option value="">全部标准</option></select>
      <select id="difficulty-filter" aria-label="按难度筛选"><option value="">全部难度</option></select>
      <button id="menu-button" class="icon-button" type="button" aria-label="打开分类" aria-controls="category-drawer" aria-expanded="false">☰</button>
    </div>
  </header>
  <div class="layout">
    <aside id="category-drawer" class="sidebar" aria-label="题目分类">
      <div class="sidebar-head"><span>分类</span><button id="close-menu" class="icon-button mobile-only" type="button" aria-label="关闭分类">×</button></div>
      <nav id="category-nav"></nav>
    </aside>
    <main class="main" id="main-content">
      <div class="list-meta"><span id="result-count">正在加载…</span><button id="clear-filters" class="text-button" type="button" hidden>清除筛选</button></div>
      <section id="question-list" class="question-list" aria-live="polite"></section>
      <div id="load-sentinel" class="load-sentinel" aria-hidden="true"></div>
      <p id="empty-state" class="empty" hidden>没有匹配的题目，试试换个关键词。</p>
    </main>
  </div>
  <div id="scrim" class="scrim" hidden></div>
  <script src="questions.js?v=ba84a14c"></script>
  <script src="app.js?v=4d91155e"></script>
</body>
</html>
