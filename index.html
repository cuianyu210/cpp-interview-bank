<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C++ 面试题库</title>
  <meta name="description" content="按主题整理的 C++ 面试问题与参考资料。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">C++</span><span>C++ 面试题库</span></div>
    <div class="toolbar">
      <label class="search"><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="搜索题目、分类或标准" autocomplete="off"></label>
      <select id="scope-filter" aria-label="按标准筛选"><option value="">全部标准</option></select>
      <button id="menu-button" class="icon-button" type="button" aria-label="打开分类" aria-controls="category-drawer" aria-expanded="false">☰</button>
    </div>
  </header>
  <div class="layout">
    <aside id="category-drawer" class="sidebar" aria-label="题目分类">
      <div class="sidebar-head"><span>分类</span><button id="close-menu" class="icon-button mobile-only" type="button" aria-label="关闭分类">×</button></div>
      <nav id="category-nav"></nav>
    </aside>
    <main class="main" id="main-content">
      <section class="intro"><p class="eyebrow">INTERVIEW NOTES</p><h1>把 500 道题，整理成可复习的路径</h1><p>按主题、标准和参考资料快速定位，适合面试前冲刺与长期查阅。</p></section>
      <div class="list-meta"><span id="result-count">正在加载…</span><button id="clear-filters" class="text-button" type="button" hidden>清除筛选</button></div>
      <section id="question-list" class="question-list" aria-live="polite"></section>
      <div id="load-sentinel" class="load-sentinel" aria-hidden="true"></div>
      <p id="empty-state" class="empty" hidden>没有匹配的题目，试试换个关键词。</p>
    </main>
  </div>
  <footer class="site-footer">综合公开面经归纳，不代表任何公司官方原题。</footer>
  <div id="scrim" class="scrim" hidden></div>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
